# Render Blueprint for the LibraVerse API (https://render.com/docs/blueprint-spec).
# Secrets are marked sync: false: Render asks for them when you apply the
# blueprint; nothing secret lives in this file.
services:
  - type: web
    name: libraverse-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false # the Vercel site, e.g. https://libraverse.vercel.app
      - key: PUBLIC_API_URL
        sync: false # this service's URL, e.g. https://libraverse-api.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CARD_QR_SECRET
        sync: false # same as server/.env: issued card QRs are signed with it
      - key: ENCRYPTION_KEY
        sync: false # same as server/.env: the shared database holds values encrypted with it
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: PLATFORM_RAZORPAY_KEY_ID
        sync: false
      - key: PLATFORM_RAZORPAY_KEY_SECRET
        sync: false
      - key: PLATFORM_RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
